<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CELEBLABEL - Link</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { 
      background: linear-gradient(135deg, #fff0f5, #f0f8ff); 
    }
    .link-card {
      transition: all 0.3s ease;
    }
    .link-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 30px -10px rgba(236, 72, 153, 0.2);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center py-12 px-4">
  <div class="max-w-md w-full mx-auto text-center">
    <div class="mb-10">
      <img src="https://via.placeholder.com/150/FF69B4/FFFFFF?text=CELEBLABEL" 
           alt="CELEBLABEL" 
           class="w-28 h-28 mx-auto rounded-3xl object-cover border-4 border-white shadow-2xl">
      <h1 class="mt-6 text-4xl font-bold text-pink-600">CELEBLABEL</h1>
      <p class="text-gray-600 mt-2 text-lg">Honest K-Beauty Reviews</p>
    </div>

    <div class="space-y-4">
      <a href="https://celeblabel.com" target="_blank" 
         class="link-card block bg-white rounded-3xl py-5 px-6 font-semibold text-lg shadow-lg hover:bg-pink-50 flex items-center justify-center gap-3">
        <i class="fa-solid fa-blog"></i> CELEBLABEL 블로그
      </a>
      
      <a href="https://www.amazon.com/shop/celeblabel" target="_blank" 
         class="link-card block bg-white rounded-3xl py-5 px-6 font-semibold text-lg shadow-lg hover:bg-pink-50 flex items-center justify-center gap-3">
        <i class="fa-solid fa-cart-shopping"></i> 아마존 추천 제품
      </a>
      
      <a href="https://instagram.com/celeblabel" target="_blank" 
         class="link-card block bg-white rounded-3xl py-5 px-6 font-semibold text-lg shadow-lg hover:bg-pink-50 flex items-center justify-center gap-3">
        <i class="fa-brands fa-instagram"></i> Instagram
      </a>
    </div>
  </div>
</body>
</html>
